<!-- Filter toolbar -->
<div class="toolbar">
    <h2 class="page-title">Products</h2>

    <div class="filters">
        <label class="field">
            <i class="fa-solid fa-filter"></i>
            <select [(ngModel)]="selectedCategory" (change)="FilterByCategory()">
                <option *ngFor="let c of Categories">{{c}}</option>
            </select>
        </label>

        <label class="field search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input #search type="text" placeholder="Search products...">
        </label>
    </div>
</div>

<!-- Product grid -->
<div class="products-grid">
    <div class="card" *ngFor="let product of filteredProduct" [routerLink]="['ProductDetails', product.id]">
        <div class="card-img">
            <img [src]="product.images[0]" [alt]="product.title">
            <span class="percent">-{{product.discountPercentage}}%</span>
        </div>
        <div class="card-body">
            <h3 class="title">{{product.title}}</h3>
            <div class="price-row">
                <span class="Dprice">{{product.price - product.price * product.discountPercentage * 0.01 | currency}}</span>
                <span class="price">{{product.price | currency}}</span>
            </div>
            <p class="desc">{{product.description}}</p>
        </div>
    </div>
</div>

<!-- States -->
<p class="notice" *ngIf="!errormsg && Products.length && !filteredProduct.length">
    <i class="fa-solid fa-box-open"></i> No products match your search.
</p>
<p class="notice error" *ngIf="errormsg">
    <i class="fa-solid fa-triangle-exclamation"></i> {{errormsg}}
</p>
