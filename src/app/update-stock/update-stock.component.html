<div class="stock-layout">

    <!-- Stock list -->
    <div class="panel table-panel">
        <h4 class="panel-title"><i class="fa-solid fa-warehouse"></i> Stock List</h4>

        <div class="table-wrap">
            <table class="stock-table">
                <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Product Name</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let data of this.stockListService.stockItemList; let i=index">
                        <td>{{data.productID}}</td>
                        <td>{{data.title}}</td>
                        <td><span class="stock-pill">{{data.stock}}</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="notice" *ngIf="!stockListService.stockItemList.length">
            <i class="fa-solid fa-box-open"></i> No stock items yet.
        </p>
    </div>

    <!-- Add stock form -->
    <aside class="panel form-panel">
        <h4 class="panel-title"><i class="fa-solid fa-square-plus"></i> Add Stock</h4>

        <div class="form-group">
            <label for="productID">Product Id</label>
            <input type="text" name="productID" id="productID" class="form-control"
                placeholder="e.g. 12" [(ngModel)]="productID">
        </div>

        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" name="stock" id="stock" class="form-control"
                placeholder="Quantity to add" [(ngModel)]="stock">
        </div>

        <button class="btn-fill" (click)="uploadStock()">
            <i class="fa-solid fa-plus"></i> Add Stock
        </button>
    </aside>

</div>
