<div class="auth-wrap" *ngIf="!this.UserDetailsService.LoggedinbyUser()">
    <div class="auth-card">

        <div class="auth-head">
            <span class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></span>
            <h2 class="auth-title">Login</h2>
            <p class="auth-sub">Welcome back to ShopCart</p>
        </div>

        <form #registerForm="ngForm" (ngSubmit)="registerForm.form.valid && onlogin()" novalidate>

            <!-- Enter Username -->
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-circle-user"></i> Username</label>
                <input type="email" name="email" id="email" appOldUserLogin class="form-control"
                    placeholder="Enter your username" #email="ngModel" required email [(ngModel)]="username" />

                <!-- Validation for Email -->
                <span class="text-danger"
                    *ngIf="(email.touched || registerForm.submitted)&& email.errors?.['required']">
                    username required
                </span>
                <span class="text-danger" *ngIf="(email.touched)&& email.errors?.['olduser']">
                    UserName not exists
                </span>
            </div>

            <!-- Enter password -->
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" appExistingpassword name="password" id="password" #password="ngModel"
                    class="form-control" placeholder="Enter your password"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" minlength="8" required [(ngModel)]="Password">

                <!-- Validation for password -->
                <span class="text-danger"
                    *ngIf="(password.touched || registerForm.submitted) && password.errors?.['required']">
                    Password required
                </span>
                <span class="text-danger"
                    *ngIf="(password.touched || registerForm.submitted)&& password.errors?.['minlength']">
                    Password must be at least 8 characters
                </span>
                <span class="text-danger"
                    *ngIf="(password.touched || registerForm.submitted) && password.errors?.['ps']">
                    wrong password
                </span>
            </div>

            <!-- captcha: random number and operator -->
            <div class="form-group">
                <label for="captcha"><i class="fa-solid fa-shield-halved"></i> Captcha</label>
                <div class="captcha-row">
                    <span class="captcha-q">{{num1}} + {{num2}} =</span>
                    <input type="text" name="captcha" id="captcha" #captcha="ngModel" class="form-control captcha-input"
                        appCaptcha required [(ngModel)]="enterVal">
                </div>

                <!-- Validation for captcha -->
                <span class="text-danger"
                    *ngIf="(captcha.touched || registerForm.submitted )&& captcha.errors?.['required']">
                    captcha required
                </span>
                <span class="text-danger" *ngIf="captcha.touched && captcha.errors?.['captcha']">
                    captcha Envalide
                </span>
            </div>

            <!-- actions -->
            <div class="actions">
                <button type="button" class="btn btn-ghost" (click)="registerForm.reset()">Cancel</button>
                <button type="submit" class="btn btn-fill">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </div>

            <p class="auth-foot">
                New to ShopCart? <a routerLink="NewUser">Create an account</a>
            </p>

        </form>
    </div>
</div>
